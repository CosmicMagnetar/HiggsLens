[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "higgslens"
version = "0.1.0"
description = "Reproducible ML benchmark and exploratory dashboard for simulated Higgs event classification"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]
